services:
  app:
    build: .
    image: express-app:latest
    container_name: express-app
    # host:container - the app is reachable on http://localhost:4567
    ports:
      - "4567:4567"
    environment:
      NODE_ENV: production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:4567/"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
